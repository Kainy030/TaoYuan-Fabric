# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Loom enables ANSI colour codes whenever a .idea/.vscode folder is present,
# which turns piped/redirected run logs into unreadable escape sequences.
# Plain console keeps `gradlew runClient` output readable everywhere.
# (IntelliJ's own Run window renders colours regardless of this setting.)
org.gradle.console=plain

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0-Dev
group=com.taoyuan

# Dependencies
fabric_api_version=0.141.6+1.21.11
