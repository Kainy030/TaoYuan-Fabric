plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"taoyuan" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	// Language files contain non-ASCII text (e.g. "桃源"), so they must be filtered as
	// UTF-8 rather than the platform default charset.
	filteringCharset = "UTF-8"

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// javac writes its diagnostics using the platform charset; on a zh-CN Windows
	// console that mangles the (UTF-8) messages into mojibake such as "閿欒".
	it.options.encoding = "UTF-8"
}

// Use a custom dev-only Log4j2 config. See log4j-dev.xml for why.
loom.log4jConfigs.from "log4j-dev.xml"

// Vanilla's own developer switch (net.minecraft.client.main.Main accepts
// "offlineDeveloperMode"). With it, Minecraft skips the Mojang session/profile
// lookup, uses UserApiService.OFFLINE and short-circuits Realms entirely
// (Minecraft.java:415/811, RealmsClient.java:151, RealmsAvailability.java:40).
//
// Without it, the dev environment's offline account makes those calls fail anyway,
// dumping multi-line 401 / SocketTimeoutException stack traces over the console
// right as the main menu opens.
loom {
	runs {
		client {
			programArg "--offlineDeveloperMode"
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// Produce a javadoc jar alongside the mod and sources jars, so a tagged release
	// carries the API documentation as well.
	withJavadocJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(Javadoc).configureEach {
	// Same reasoning as the JavaCompile encoding above: the sources contain non-ASCII
	// text (e.g. "招灾"), and javadoc otherwise reads and writes them using the platform
	// charset, which mangles them on a zh-CN Windows install.
	options.encoding = "UTF-8"
	options.charSet = "UTF-8"
	options.docEncoding = "UTF-8"

	// The javadoc here is written for readers of the source, not as a published API
	// contract, so it deliberately omits @param/@return on self-explanatory members.
	// doclint would fail the build over exactly that.
	options.addStringOption("Xdoclint:none", "-quiet")
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
